[env._]
file = ".env"

[settings]
locked = true

[tools]
python = "3.12.15"
awscli = "2.34.1"
jactionlint = "2.2.0"

[tasks.build]
description = "Build dist outputs from archive/"
dir = "{{config_root}}"
run = "./lib/build.sh \"$@\""

[tasks.clean]
description = "Clean generated artifacts"
dir = "{{config_root}}"
run = "./lib/clean.sh \"$@\""

[tasks.fetch]
description = "Fetch recent Slack history from the Web API as an export directory"
dir = "{{config_root}}"
run = "./lib/fetch.py \"$@\""

[tasks.lint]
description = "Run all linters"
depends = ["lint:actions"]

[tasks."lint:actions"]
description = "Check GitHub Actions workflows"
sources = [".github/workflows/*.yml", ".github/workflows/*.yaml", ".github/jactionlint.yaml"]
run = "jactionlint --strict-exit"

[tasks.merge]
description = "Merge a Slack export into archive/"
dir = "{{config_root}}"
run = "./lib/merge.py \"$@\""

[tasks.publish]
description = "Run merge, build, and upload"
dir = "{{config_root}}"
run = "./lib/publish.sh \"$@\""

[tasks.serve]
description = "Build if needed and open dist/index.html"
dir = "{{config_root}}"
run = "./lib/serve.sh \"$@\""

[tasks.setup]
description = "Install/check tools and initialize submodules"
dir = "{{config_root}}"
run = "./lib/setup.sh \"$@\""

[tasks.state]
description = "Pull or push archive/ state in R2"
dir = "{{config_root}}"
run = "./lib/state.sh \"$@\""

[tasks.upload]
description = "Package dist/ and upload to R2"
dir = "{{config_root}}"
run = "./lib/upload.sh \"$@\""
